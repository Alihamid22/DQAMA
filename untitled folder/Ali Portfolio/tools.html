<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tools & Overig Details</title>
    <style>
       
        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .dienst-box {
            background-color: #94b9b4; 
            width: 700px;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .icon-container {
            background-color: #e8f0f0;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 15px;
        }

        .icon-container img {
            width: 35px;
        }

        h2 {
            margin: 10px 0;
            color: #1a1a1a;
            font-size: 24px;
        }
     
        .details-list {
            text-align: left;
            margin: 20px 0 30px 10px;
        }

        .details-item {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            font-size: 16px;
            color: #1a1a1a;
        }

        .check-icon {
            color: #1d3557;
            font-weight: bold;
            margin-right: 10px;
        }

        
        .btn-terug {
            display: inline-block;
            background-color: #1d3557; 
            color: white;
            text-decoration: none;
            padding: 10px 30px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 15px;
            transition: 0.3s ease;
        }

        .btn-terug:hover {
            background-color: #000;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="dienst-box">
    <div class="bx bxl-git">
        <svg width="35" height="35" viewBox="0 0 24 24" fill="none" stroke="#1d3557" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
    </div>

    <h2>Tools & Overig</h2>
    

    <div class="details-list">
        <div class="details-item"><span class="check-icon">✓</span> Git & GitHub</div>
        <div class="details-item"><span class="check-icon">✓</span> Samenwerken</div>
        <div class="details-item"><span class="check-icon">✓</span> Communicatie</div>
        <div class="details-item"><span class="check-icon">✓</span> Leergierig</div>
        <div class="details-item"><span class="check-icon">✓</span> Tijdbeheer</div>
    </div>

    <a href="index.html" class="btn-terug">Terug</a>
</div>

</body>
</html>
